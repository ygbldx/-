name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack ZIP
        run: |
          if [ -f "TvColorMarker.zip" ] && [ ! -f "settings.gradle.kts" ]; then
            unzip -o TvColorMarker.zip -d .
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TvColorMarker.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TvColorMarker-APK
          path: TvColorMarker.apk
          retention-days: 30
